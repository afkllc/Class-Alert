<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Alert</title>
    <style>
        :root {
            --bg-deep: #0f1115;
            /* Deepest matte charcoal */
            --bg-surface: #1a1f26;
            --accent: #f75142;
            --text-main: #ffffff;
            --text-sub: #5f6b7c;
            /* Muted technical gray */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            /* Font stack: Antebas for personality, Monospace for technical data */
            font-family: 'Antebas', system-ui, -apple-system, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;

            /* A subtle, static vignette instead of a breathing background */
            /* This feels more like 'film' and less like a screensaver */
            background: radial-gradient(circle at center, var(--bg-surface) 0%, var(--bg-deep) 120%);
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 48px;
            /* High editorial whitespace */
        }

        /* --- HERO TYPOGRAPHY --- */
        .alert-title {
            font-family: 'Antebas Bold', serif;
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.04em;
            /* Tight editorial tracking */
            color: var(--text-main);

            /* Clean hard reveal, no blurry fade */
            opacity: 0;
            transform: translateY(20px);
            animation: riseUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.4s;
        }

        .class-title {
            font-family: 'Antebas Bold', serif;
            font-size: clamp(3rem, 5vw, 5rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--text-main);
            opacity: 0;
            transform: translateY(20px);
            animation: riseUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.4s;
        }

        .alert-message {
            max-width: 560px;
            color: var(--text-sub);
            font-size: 1rem;
            line-height: 1.5;
            opacity: 0;
            animation: fadeIn 0.8s ease-out forwards 0.5s;
        }

        /* --- INTERFACE BUTTON --- */
        .btn-launch {
            appearance: none;
            border: none;
            background: var(--text-main);
            /* White button on dark BG = Premium contrast */
            color: var(--bg-deep);
            /* Dark text */

            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            font-weight: 600;
            font-size: 1rem;
            padding: 18px 42px;
            border-radius: 4px;
            /* Slightly squared for a 'technical' feel, less bubbly */

            cursor: pointer;
            position: relative;
            opacity: 0;
            animation: riseUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.6s;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-launch:hover {
            transform: translateY(-2px);
            background-color: #f0f0f0;
            /* Slight dim on hover */
        }

        .btn-launch:active {
            transform: translateY(0);
            background-color: #e0e0e0;
        }

        .btn-dismiss {
            appearance: none;
            border: 1px solid var(--accent);
            background: transparent;
            color: var(--accent);
            font: inherit;
            font-size: 0.95rem;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0;
            animation: fadeIn 0.8s ease-out forwards 0.7s;
        }

        .btn-dismiss:hover {
            border-color: var(--accent);
            color: var(--text-main);
            background: rgba(247, 81, 66, 0.12);
        }

        .btn-dismiss[hidden] {
            display: none;
        }

        .button-row {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* --- ANIMATION UTILS --- */
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes riseUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <p class="alert-title" id="display-alert-title">Class starting now</p>
        <h1 class="class-title" id="display-class-name">...</h1>
        <p class="alert-message" id="display-alert-message">Your scheduled class is ready to join.</p>

        <div class="button-row">
            <button class="btn-launch" id="btn-join-trigger">Join Now</button>
            <button class="btn-dismiss" id="btn-dismiss-trigger" type="button">Dismiss</button>
        </div>
    </div>

    <script src="schedule-utils.js"></script>
    <script src="alert.js"></script>
</body>

</html>
