<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Intercept</title>
    <style>
        :root {
            --bg-deep: #0f1115;
            /* Deepest matte charcoal */
            --bg-surface: #1a1f26;
            --accent: #f75142;
            --text-main: #ffffff;
            --text-sub: #5f6b7c;
            /* Muted technical gray */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            /* Font stack: Antebas for personality, Monospace for technical data */
            font-family: 'Antebas', system-ui, -apple-system, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;

            /* A subtle, static vignette instead of a breathing background */
            /* This feels more like 'film' and less like a screensaver */
            background: radial-gradient(circle at center, var(--bg-surface) 0%, var(--bg-deep) 120%);
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 48px;
            /* High editorial whitespace */
        }

        /* --- THE STATUS COMPONENT (No more pill) --- */
        .live-signal {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, monospace;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            opacity: 0;
            animation: fadeIn 0.8s ease-out forwards 0.2s;
        }

        /* The physical "recording light" dot */
        .signal-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
            /* Tight, realistic light bleed */
            animation: pulse-physical 2s infinite cubic-bezier(0.66, 0, 0, 1);
        }

        @keyframes pulse-physical {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.4;
                transform: scale(0.9);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* --- HERO TYPOGRAPHY --- */
        .class-title {
            font-family: 'Antebas Bold', serif;
            font-size: clamp(3.5rem, 5vw, 6rem);
            font-weight: 800;
            line-height: 1.0;
            letter-spacing: -0.04em;
            /* Tight editorial tracking */
            color: var(--text-main);

            /* Clean hard reveal, no blurry fade */
            opacity: 0;
            transform: translateY(20px);
            animation: riseUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.4s;
        }

        /* --- INTERFACE BUTTON --- */
        .btn-launch {
            appearance: none;
            border: none;
            background: var(--text-main);
            /* White button on dark BG = Premium contrast */
            color: var(--bg-deep);
            /* Dark text */

            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            font-weight: 600;
            font-size: 1rem;
            padding: 18px 42px;
            border-radius: 4px;
            /* Slightly squared for a 'technical' feel, less bubbly */

            cursor: pointer;
            position: relative;
            opacity: 0;
            animation: riseUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.6s;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-launch:hover {
            transform: translateY(-2px);
            background-color: #f0f0f0;
            /* Slight dim on hover */
        }

        .btn-launch:active {
            transform: translateY(0);
            background-color: #e0e0e0;
        }

        /* --- ANIMATION UTILS --- */
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes riseUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- The New "Broadcast" Status -->
        <div class="live-signal">
            <!-- <div class="signal-dot"></div> -->
            <span>Session Active</span>
        </div>

        <!-- The Class Name -->
        <h1 class="class-title" id="display-class-name">...</h1>

        <!-- The Tactile Action -->
        <button class="btn-launch" id="btn-join-trigger"
            style="animation: pulse-physical 2s infinite cubic-bezier(0.66, 0, 0, 1);">Join Now</button>
    </div>

    <script src="alert.js"></script>
</body>

</html>
